<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Previous orders</title>
        <link rel="icon" type = "img/png" href = "Logo.png">
        <link rel="stylesheet" href="prevorders.css">
        
    </head>
    <body>
         <section class="top desktop-only">
            <a href = "index.html" class = "logo-link">
                <img src = "Logo.png" alt = "Logo" class = "logomob">
            </a> 
            <span class="location">College</span>
            
            <div class="search-box">
                <input type="text" id="equipment_search_desk" placeholder="Search for equipment..">
                <button class="search-button" id="search_button_desk">Search</button>
            </div>

            <div class="orders" >
                <a href="prevorders.html" class = "cart-link-wrapper">
                <button class="orders-button">Previous orders</button>
                <img class="orders-image" src="orders.svg" alt="Previous orders">
                </a>
            </div>

            <div class="cart">
                <a href="cart.html" class = "cart-link-wrapper">
                <button class="cart-button">Cart</button>  
                <img class="cart-image" src="cart.svg" alt="Cart">
                </a>
            </div>

            <div>
                <a href="login.html">
                <button class="login-button" id="login-btn-desk">Login</button>
                </a>
            </div>
            <div id="custom-popup" class="popup-overlay">
    <div class="popup-box">
        <h3>Login Required</h3>
        <p>Please log in first to rent equipment!</p>
        <div class="popup-buttons">
            <button id="popup-login-btn">Go to Login</button>
            <button id="popup-close-btn">Cancel</button>
        </div>
    </div>
</div>
        </section>

       <section class="top mobile-only">
    <input type="checkbox" id="menu-toggle" hidden>
    
    <div class="main-bar">
        <label for="menu-toggle" class="hamburger-btn">☰</label>
        <a href = "index.html" class = "logo-link">
                <img src = "Logo.png" alt = "Logo" class = "logomob">
            </a> 
        
        <div class="searchmob">
            <input type="text" placeholder="Search..." id="equipment_search_mob">
            <button class="search-buttonmob" id="search_button_mob">Search</button>
        </div>
         <a href="login.html">
        <button class="loginmob" id="login-btn-mob">Login</button>
         </a>
    </div>

    <div class="dropdown-menu">
        <span class="location">College</span>
        <div class="orders">
            <a href="prevorders.html" class = "cart-link-wrapper">
            <button class="orders-button">Previous orders</button>
            <img class="orders-image" src="orders.svg" alt="Previous orders">
            </a>
        </div>
        <div class="cart">
            <a href="prevorders.html" class = "cart-link-wrapper">
            <button class="cart-button">Cart</button>  
            <img class="cart-image" src="cart.svg" alt="Cart">
            </a>
        </div>
    </div>
</section>
        <div class="previous">
            <h1>Previous orders</h1>
        </div>
        <div class="nothing">
            <h2> No equipment rented yet. Rent now!</h2>
        </div>
        <div id="custom-popup" class="popup-overlay">
            <div class="popup-box">
                <h3>Login Required</h3>
                <p>Please log in first to view previous orders!</p>
                <div class="popup-buttons">
                    <button id="popup-login-btn">Go to Login</button>
                    <button id="popup-close-btn">Go Back</button>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
    const storedUser = localStorage.getItem("startupUser");
    const storedCollege = localStorage.getItem("startupCollege");

    
    if (storedCollege) {
        const locationElements = document.querySelectorAll(".location");
        locationElements.forEach((el) => {
            el.textContent = storedCollege;
        });
    }

    
    if (storedUser) {
        const loginButtons = document.querySelectorAll("#login-btn-desk, #login-btn-mob, .login-button, .loginmob");

        loginButtons.forEach((loginButton) => {
            loginButton.textContent = storedUser;
            loginButton.style.backgroundColor = "#fffffd";
            loginButton.style.color = "#14532d";

            const parentLink = loginButton.closest("a");
            if (parentLink) {
                parentLink.removeAttribute("href");
            }

            const logoutBox = document.createElement("div");
            logoutBox.textContent = "Log Out";
            logoutBox.className = "logout-popup";
            document.body.appendChild(logoutBox);

            loginButton.addEventListener("click", (e) => {
                e.stopPropagation();
                const rect = loginButton.getBoundingClientRect();
                logoutBox.style.top = (rect.bottom + window.scrollY + 5) + "px";
                logoutBox.style.left = (rect.left + window.scrollX) + "px";
                logoutBox.style.display = logoutBox.style.display === "block" ? "none" : "block";
            });

            logoutBox.addEventListener("click", () => {
                localStorage.removeItem("startupUser");
                localStorage.removeItem("startupCollege");
                location.reload();
            });
        });

        document.addEventListener("click", () => {
            document.querySelectorAll(".logout-popup").forEach(box => box.style.display = "none");
        });

        
        renderCart();
    } else {
        
        document.getElementById("custom-popup").style.display = "flex";
    }

    function renderCart() {
        const cartContainer = document.getElementById("cart-container");
        let cart = JSON.parse(localStorage.getItem("cartItems")) || [];

        cart = cart.map(item => ({ ...item, quantity: item.quantity || 1 }));

        if (cart.length === 0) {
            cartContainer.innerHTML = `<div class="nothing"><h2>Your cart is empty!</h2></div>`;
            return;
        }

        cartContainer.innerHTML = "";

        cart.forEach((item, index) => {
            const card = document.createElement("div");
            card.classList.add("equipment-card");
            
            card.innerHTML = `
                <img src="${item.image}" alt="${item.name}">
                <div class="card-info">
                    <h3>${item.name}</h3>
                    <p class="description">${item.description}</p>
                    <p class="price">${item.price}</p>
                    
                    <div class="cart-controls">
                        <div class="quantity-picker">
                            <button class="qty-btn minus-btn">-</button>
                            <span class="qty-count">${item.quantity}</span>
                            <button class="qty-btn plus-btn">+</button>
                        </div>
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
            `;

            card.querySelector(".minus-btn").addEventListener("click", () => {
                if (item.quantity > 1) {
                    item.quantity--;
                    localStorage.setItem("cartItems", JSON.stringify(cart));
                    renderCart();
                }
            });

            card.querySelector(".plus-btn").addEventListener("click", () => {
                item.quantity++;
                localStorage.setItem("cartItems", JSON.stringify(cart));
                renderCart();
            });

            card.querySelector(".remove-btn").addEventListener("click", () => {
                cart.splice(index, 1);
                localStorage.setItem("cartItems", JSON.stringify(cart));
                renderCart();
            });

            cartContainer.appendChild(card);
        });

        const submitSection = document.createElement("div");
        submitSection.className = "checkout-section";
        submitSection.innerHTML = `
            <button id="submit-cart-btn" class="submit-btn">Confirm & Submit Order</button>
        `;
        cartContainer.appendChild(submitSection);

        document.getElementById("submit-cart-btn").addEventListener("click", () => {
            localStorage.removeItem("cartItems");
            document.getElementById("submit-popup").style.display = "flex";
        });
    }

    
    const homeBtn = document.getElementById("popup-home-btn");
    if (homeBtn) {
        homeBtn.addEventListener("click", () => {
            window.location.href = "index.html";
        });
    }

    const loginBtn = document.getElementById("popup-login-btn");
    if (loginBtn) {
        loginBtn.addEventListener("click", () => {
            window.location.href = "login.html";
        });
    }

    const closeBtn = document.getElementById("popup-close-btn");
    if (closeBtn) {
        closeBtn.addEventListener("click", () => {
            window.location.href = "index.html";
        });
    }
});
        </script>
    </body>
</html>
