<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Homepage</title>
        <link rel="stylesheet" href="Homepagecss.css">
    </head>
    <body>

        <section class="top desktop-only">
            <img class="logo" src="logo.jpg" alt="Logo">
            <span class="location">College, Area</span>
            
            <div class="search-box">
                <input type="text" id="equipment_search_desk" placeholder="Search for equipment..">
                <button class="search-button" id="search_button_desk">Search</button>
            </div>

            <div class="orders">
                <button class="orders-button">Previous orders</button>
                <img class="orders-image" src="orders.svg" alt="Previous orders">
            </div>

            <div class="cart">
                <button class="cart-button">Cart</button>  
                <img class="cart-image" src="cart.svg" alt="Cart">
            </div>

            <div>
                <button class="login-button">Login</button>
            </div>
        </section>

       <section class="top mobile-only">
    <input type="checkbox" id="menu-toggle" hidden>
    
    <div class="main-bar">
        <label for="menu-toggle" class="hamburger-btn">☰</label>
        <img class="logomob" src="logo.jpg" alt="Logo">
        
        <div class="searchmob">
            <input type="text" placeholder="Search..." id="equipment_search_mob">
            <button class="search-buttonmob" id="search_button_mob">Search</button>
        </div>

        <button class="loginmob">Login</button>
    </div>

    <div class="dropdown-menu">
        <span class="location">College, Area</span>
        <div class="orders">
            <button class="orders-button">Previous orders</button>
            <img class="orders-image" src="orders.svg" alt="Previous orders">
        </div>
        <div class="cart">
            <button class="cart-button">Cart</button>  
            <img class="cart-image" src="cart.svg" alt="Cart">
        </div>
    </div>
</section>
</html>
