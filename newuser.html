<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Among Us</title>
    <link rel="stylesheet" href="Homepagecss.css">
    <link rel="icon" type = "img/png" href = "Logo.png">
    <style>
        .login-box {
            max-width: 400px;
            margin: 50px auto;
            background-color: #14532d;
            padding: 30px;
            border-radius: 20px;
            color: white;
        }
        .login-box form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .login-box input, .login-box select {
            padding: 10px;
            border-radius: 8px;
            border: none;
        }
        .login-box button {
            background-color: #fff1b7;
            color: #059669;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="text-align: center; color: #fff1b7;">Student Login</h2>
        <form id="real-login-form">
            <label>Enter your full name</label>
            <input type="text" id="username-input" placeholder="Enter your name" required>
            <label>Enter your mobile number</label>
            <input type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="Enter mobile number" required>

            <label>Select College</label>
            <select id="college-select" required>
                <option value="" disabled selected>Choose college</option>
                <option value="campus1">Ramaiah University of Applied Sciences (GG campus)</option>
                <option value="campus2">Ramaiah University of Applied Sciences (RT campus)</option>
            </select>

            <label>Enter username</label>
            <input type="text" id="username" placeholder="Enter a username" required>
            <label>Enter password</label>
            <input type="text" id="username" placeholder="Enter a password" required>
            <label>Upload ID Card Photo</label>
            <input type="file" accept="image/*" required>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('real-login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('username-input').value;
    const collegeDropdown = document.getElementById('college-select');
    const collegeText = collegeDropdown.options[collegeDropdown.selectedIndex].text;

    localStorage.setItem('startupUser', name);
    localStorage.setItem('startupCollege', collegeText);

    window.location.href = 'index.html';
});
    </script>
</body>
</html>
